name: CI

# Tests run on every push and every pull request. The deploy runs only on
# main, and only after the tests have passed. See docs/deploy.md §5.

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first, so a stale run never
# reports on code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # test_decode.py fetches a live ChatGPT share page. Off in CI on purpose:
      # a build that goes red because a third party was slow, rate-limited us,
      # or decided our requests looked like a bot tells you nothing about the
      # change under test. The other four backend tests are offline.
      ARCHIVE_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v6

      # ── backend ──────────────────────────────────────────────────────────
      # The suite is stdlib unittest with no dependencies, so it runs on the
      # interpreter the runner already has. Also exercised through pytest,
      # which is what `backend/pyproject.toml` declares — that config pointed
      # at a `src/` directory which no longer exists until recently, and this
      # is the job that would have caught it.
      - name: Backend — run each test file
        working-directory: backend
        run: |
          shopt -s nullglob
          files=(test/test_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no backend tests found — the glob matched nothing"
            exit 1
          fi
          fail=0
          for t in "${files[@]}"; do
            echo "::group::$t"
            python3 "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - uses: astral-sh/setup-uv@v6

      # `uv sync` then `uv run`, not `uvx --with pytest`: this resolves the
      # project's own dev dependency group, which is what provides pywrangler.
      # That group was missing `workers-py` once, and the only symptom was a
      # deploy failing with "Failed to spawn: pywrangler" — a bug CI should
      # have caught and would not have, running an ephemeral pytest instead.
      - name: Backend — sync the dev environment
        working-directory: backend
        run: uv sync

      - name: Backend — run through pytest
        working-directory: backend
        run: uv run pytest -q

      # ── frontend ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      - name: Frontend — library tests
        working-directory: frontend
        run: npm run test:lib

      - name: Frontend — typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # build:check, not build: it writes .next-build/ so it cannot collide
      # with a dev server's .next/. Harmless here, and it keeps CI on the same
      # command a human runs locally.
      - name: Frontend — production build
        working-directory: frontend
        run: npm run build:check

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      # Refuse to deploy unless the write API is still behind Cloudflare Access.
      # Reads are public and writes are private (README), so /api/desk/* must be
      # covered by a self-hosted Access application with an allow policy. A
      # deploy that dropped that would put the write API on the open internet.
      #
      # What this proves is narrower: /api/desk/whoami is served under an Access
      # application with an Allow policy and no Bypass policy. It does not prove
      # every /api/desk/ path is covered; a separate app on, say,
      # /api/desk/ingest with a Bypass policy would not be seen.
      #
      # This asks the Cloudflare API rather than curling the path: Cloudflare
      # answers GitHub's runners with a bare 403, not the 302 to the login that
      # a browser gets, so the curl form could never pass here. It needs
      # "Account · Access: Apps and Policies · Read" on the deploy token.
      #   List apps:  https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/applications/methods/list/
      #   Get policy: https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/policies/methods/get/
      #   Permission: https://developers.cloudflare.com/fundamentals/api/reference/permissions/
      # A self-hosted app lists what it covers in `destinations` (type public,
      # `uri`), or in the deprecated `domain` / `self_hosted_domains`; each of its
      # `policies` carries a `decision`, and one given by id alone is a reusable
      # policy fetched on its own.
      #
      # Only the most specific covering app counts: "When multiple rules are set
      # for a common root path, the more specific rule takes precedence."
      #   https://developers.cloudflare.com/cloudflare-one/access-controls/policies/app-paths/
      # So an exact destination beats a wildcard, a longer wildcard prefix beats
      # a shorter one, and the bare domain ranks with `akshayprabhakant.com/*`;
      # a tie judges every app in it. That app must have an Allow policy and no
      # Bypass policy, because Bypass is evaluated before Allow and lets
      # everyone through.
      #   https://developers.cloudflare.com/cloudflare-one/access-controls/policies/
      # Nor may a destination of that app that covers the path carry any
      # `overrides`: "Each rule can make a matching path public, bypassing
      # Access authentication." The docs do not say whether `path_pattern` is
      # relative to the destination `uri`, so any override refuses.
      #   https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/applications/methods/create/
      # One step on purpose: a later change can swap
      # it for `npx -y @akshaydev17/portfolio-app@<version> verify --path
      # /api/desk/whoami` in one line.
      - name: Check the path is behind Cloudflare Access
        env:
          ACCESS_PATH: /api/desk/whoami
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          api = "https://api.cloudflare.com/client/v4"
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          host = "akshayprabhakant.com"
          target = host + os.environ["ACCESS_PATH"]
          need = "Account · Access: Apps and Policies · Read"

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          if not token or not account:
              fail("CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so the Access login cannot be confirmed. Refusing to deploy.")

          def get(path):
              req = urllib.request.Request(api + path, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      body = json.load(e)
                  except ValueError:
                      body = {"errors": [{"message": f"HTTP {e.code}"}]}
                  codes = {err.get("code") for err in body.get("errors") or []}
                  if e.code in (401, 403) or 10000 in codes:
                      fail(f"The deploy token cannot read Cloudflare Access applications (HTTP {e.code}). Find the deploy token under My Profile → API Tokens if it is a user token, or Manage Account → Account API Tokens if it is an account token; Edit it, add '{need}', and save. The token value and the GitHub secret do not change. Refusing to deploy.")
                  fail(f"Cloudflare answered HTTP {e.code} for {path}: {json.dumps(body.get('errors'))[:400]}")
              except (urllib.error.URLError, TimeoutError) as e:
                  fail(f"The Cloudflare API did not answer ({e}), so the Access login cannot be confirmed")
              if not body.get("success"):
                  fail(f"Cloudflare refused {path}: {json.dumps(body.get('errors'))[:400]}")
              return body

          def specificity(uri):
              uri = uri.split("://", 1)[-1].lower()
              if uri == target:
                  return (2, len(uri))
              if uri.endswith("/*") and target.startswith(uri[:-1]):
                  return (1, len(uri) - 2)
              if uri == host:
                  return (1, len(host))
              return None

          def overridden(app):
              return any(d.get("overrides") and specificity(d.get("uri", "")) for d in app.get("destinations") or [])

          def decisions(app):
              found = set()
              for p in app.get("policies") or []:
                  if isinstance(p, str):
                      p = {"id": p}
                  if "decision" not in p and p.get("id"):
                      p = get(f"/accounts/{account}/access/policies/{p['id']}")["result"]
                  found.add(p.get("decision"))
              return found

          apps, page = [], 1
          while True:
              body = get(f"/accounts/{account}/access/apps?page={page}&per_page=100")
              result = body.get("result") or []
              apps += result
              total = (body.get("result_info") or {}).get("total_pages")
              if (page >= total) if total else len(result) < 100:
                  break
              page += 1

          ranked = []
          for app in apps:
              if app.get("type") != "self_hosted":
                  continue
              uris = [d.get("uri", "") for d in app.get("destinations") or [] if d.get("type", "public") == "public"]
              uris += [app.get("domain") or ""] + list(app.get("self_hosted_domains") or [])
              ranks = [r for r in (specificity(u) for u in uris if u) if r]
              if ranks:
                  ranked.append((max(ranks), app))

          if not ranked:
              fail(f"No self-hosted Cloudflare Access application covers {target}, so it would be on the open internet. Refusing to deploy.")
          top = max(rank for rank, _ in ranked)
          for rank, app in ranked:
              if rank != top:
                  continue
              if overridden(app):
                  fail(f"{target} is served by the Access application '{app.get('name')}', whose destination covering it has overrides that can make paths public. Refusing to deploy.")
              found = decisions(app)
              if "bypass" in found:
                  fail(f"{target} is served by the Access application '{app.get('name')}', which has a Bypass policy, so anyone can reach it. Refusing to deploy.")
              if "allow" not in found:
                  fail(f"{target} is served by the Access application '{app.get('name')}', which has no Allow policy. Refusing to deploy.")
          print(f"{target} is served by the Access application(s) {', '.join(repr(app.get('name')) for rank, app in ranked if rank == top)} with an Allow policy and no Bypass policy")
          PY

      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      # Fails loudly and early rather than halfway through a deploy. Secrets
      # are not exposed to pull requests from forks, and a missing one here
      # produces a confusing auth error several steps later otherwise.
      - name: Check the deployment secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set. Run scripts/setup-cloudflare.sh, or add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing

      # Prove the token actually carries D1 before relying on it.
      #
      # The "Edit Cloudflare Workers" template does not include any D1
      # permission, and neither does the token Workers Builds generates. Without
      # this check the deploy below succeeds and the migration above it fails —
      # or worse, silently does nothing — which is a broken pipeline with a
      # green tick.
      - name: Check the token can reach D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          body=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          if ! printf '%s' "$body" | grep -q '"success": *true'; then
            echo "::error::This token cannot reach D1. Add 'Account · D1 · Edit' to it (API tokens → Edit), then re-run. Cloudflare said:"
            printf '%s\n' "$body" | head -c 400
            exit 1
          fi
          echo "Token can reach D1."

      # The Worker binds the R2 bucket `ai-chat-archive-media`, and a deploy
      # whose binding names a missing bucket fails. R2 also has to be enabled on
      # the account first (dashboard → R2, a one-time $0 checkout on the free
      # plan), and the token needs "Workers R2 Storage · Edit". Checked here so
      # each of those reads as its own clear error, not a deploy stack trace.
      - name: Check the R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          body=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")
          if ! printf '%s' "$body" | grep -q '"success": *true'; then
            echo "::error::This token cannot reach R2. Enable R2 on the account, then add 'Account · Workers R2 Storage · Edit' to the token. Cloudflare said:"
            printf '%s\n' "$body" | head -c 400
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"name": *"ai-chat-archive-media"'; then
            echo "::error::The R2 bucket ai-chat-archive-media does not exist. Create it: npx wrangler r2 bucket create ai-chat-archive-media"
            exit 1
          fi
          echo "R2 bucket ai-chat-archive-media is reachable."

      # Migrations before the deploy: the new Worker may depend on a table the
      # old one never created. `migrations apply` is idempotent — it applies
      # only what the d1_migrations table says is outstanding — so this is safe
      # to run on every push.
      #
      # Plain `wrangler`, not `pywrangler`: D1 has nothing to do with the
      # Worker's runtime, and pywrangler wraps wrangler for the Python build
      # specifically. Keeping the language-specific tool for the language-
      # specific step means a change to pywrangler cannot break migrations.
      - name: Apply D1 migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler d1 migrations apply ai-chat-archive --remote

      - name: Deploy the Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy

      # A deploy that reports success and serves 500s is not a deploy. This is
      # also the check that tells us whether Python Workers expose self.ctx:
      # ctx.access is documented for JavaScript only, so /api/health exists to
      # answer the question rather than let us assume it.
      - name: Verify the deployed Worker answers
        run: |
          url="https://akshayprabhakant.com/api/health"
          for attempt in 1 2 3 4 5; do
            body=$(curl -sS --max-time 20 "$url" || true)
            if [ -n "$body" ]; then break; fi
            echo "no response yet (attempt $attempt/5)"
            sleep 5
          done
          if [ -z "$body" ]; then
            echo "::error::$url did not answer after the deploy"
            exit 1
          fi
          echo "$body"
          printf '%s' "$body" | grep -q '"context_available": *true' || \
            echo "::warning::context_available is not true — check docs/access-limits.md before relying on Access for identity"

