          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          api = "https://api.cloudflare.com/client/v4"
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          host = "akshayprabhakant.com"
          target = host + os.environ["ACCESS_PATH"]
          need = "Account · Access: Apps and Policies · Read"

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          if not token or not account:
              fail("CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so the Access login cannot be confirmed. Refusing to deploy.")

